name: Release
# 仅在推送 v* 版本标签时触发全平台编译
# Triggered only when pushing version tags like v1.0.0

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      # 1. Checkout 源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 4. 安装 Linux 系统依赖（WebKit2GTK 等）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # 5. 安装前端依赖
      - name: Install frontend dependencies
        run: npm install

      # 6. 使用 Tauri Action 构建 + 发布 NSIS 安装包
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BrainSync ${{ github.ref_name }}"
          releaseBody: |
            BrainSync 脑波同化 — ${{ github.ref_name }}

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false

      # 7. 提取 Windows 纯绿色便携版 .exe 单文件
      - name: Extract Portable .exe (Windows)
        if: runner.os == 'Windows'
        run: |
          $exeName = "app.exe"
          $portableName = "BrainSync_${{ github.ref_name }}_Portable_x64.exe"
          $src = "src-tauri/target/release/$exeName"
          if (!(Test-Path $src)) {
            Write-Error "Portable binary not found at: $src"
            exit 1
          }
          Copy-Item $src $portableName
          Write-Host "Portable binary ready: $portableName ($((Get-Item $portableName).Length) bytes)"

      # 8. 将绿色便携版挂载到 GitHub Release Assets
      - name: Upload Portable .exe to Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: BrainSync_${{ github.ref_name }}_Portable_x64.exe
          fail_on_unmatched_files: true
